      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean compile, test and build release JAR
        run: ./gradlew clean :client:compileJava :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Verify release output and prohibited readback calls
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.2-release.jar'
          test -f "$jar_path"
          unzip -t "$jar_path" >/dev/null
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.2'

          rm -rf /tmp/v032-release
          mkdir -p /tmp/v032-release
          unzip -q "$jar_path" -d /tmp/v032-release
          candidates=/tmp/v032-glgetteximage-candidates.txt
          grep -R -l -a -F 'glGetTexImageub' /tmp/v032-release --include='*.class' \
            | sort | sed 's#^/tmp/v032-release/##' > "$candidates" || true
          while IFS= read -r class_file; do
            [ -n "$class_file" ] || continue
            class_name="${class_file%.class}"
            class_name="${class_name//\//.}"
            [ "$class_name" = 'jaggl.OpenGL' ] && continue
            if javap -classpath "$jar_path" -c -p "$class_name" 2>/dev/null \
              | grep -F 'jaggl/OpenGL.glGetTexImageub' >/dev/null; then
              echo "Unsupported executable JAGGL readback caller remains: $class_name" >&2
              exit 1
            fi
          done < "$candidates"

      - name: Commit verified remediation source
        id: source
        shell: bash
        run: |
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add \
            client/build.gradle.kts \
            client/src/Class258_Sub3_Sub1.java \
            client/src/net/runelite/client/game/GameStateBridge.java \
            client/src/net/runelite/client/plugins/PluginManager.java \
            client/src/net/runelite/client/plugins/banktags/BankTagsPanel.java \
            client/src/net/runelite/client/plugins/banktags/BankTagsPlugin.java \
            client/src/net/runelite/client/plugins/idlenotifier/IdleNotifierPlugin.java \
            client/src/net/runelite/client/plugins/inventorygrid/InventoryGridOverlay.java \
            client/src/net/runelite/client/runelite.properties \
            release-notes/v0.3.2.md
          git rm .github/workflows/v032-apply-remediation-wave1.yml
          git commit -m 'Begin v0.3.2 plugin remediation'
          git push origin HEAD:fix/v0.3.2-plugin-remediation-wave1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage verified test build
        shell: bash
        run: |
          mkdir -p release
          cp client/build/libs/void-client-0.3.2-release.jar \
            release/void-client-0.3.2-remediation-wave1.jar
          (cd release && sha256sum void-client-0.3.2-remediation-wave1.jar \
            > void-client-0.3.2-remediation-wave1.jar.sha256)
          cat > release/void-client-0.3.2-remediation-wave1.build-info <<EOF
          branch=fix/v0.3.2-plugin-remediation-wave1
          source_sha=${{ steps.source.outputs.sha }}
          workflow_run=${{ github.run_id }}
          scope=transactional plugin lifecycle; stable NPC polling identity; scene reset; valid vital baselines; Bank Tags thread ownership; Inventory Grid null safety; JAGGL optional-feature fallback
