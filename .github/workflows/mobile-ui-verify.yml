name: Mobile UI verification

on:
  push:
    branches: [feature/mobile-responsive-ui]
  pull_request:
    branches: [feature/mobile-responsive-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source snapshot
        run: git archive --format=zip --output=mobile-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: void-client-mobile-source
          path: mobile-source.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser bridge unit tests
        run: node --test web/mobile/test/*.test.mjs
      - name: Compile and test
        run: bash ./gradlew :client:compileJava :client:test --stacktrace
      - name: Test real standalone Swing host
        run: xvfb-run -a -s '-screen 0 1920x1200x24' bash ./gradlew --no-daemon :client:standaloneHostTest --stacktrace
      - name: Build obfuscated release and dedicated Jar Runner distribution
        run: bash ./gradlew :client:proguardJar :client:jarRunnerJar --stacktrace
      - name: Test obfuscated Jar Runner startup on portrait display
        run: xvfb-run -a -s '-screen 0 390x844x24' bash ./gradlew --no-daemon :client:standaloneReleaseTest --stacktrace
      - name: Check browser symbols in the obfuscated release
        run: |
          javap -classpath client/build/libs/void-client-0.3.0-release.jar MobileLauncher | grep 'setDisplayScale'
          javap -classpath client/build/libs/void-client-0.3.0-release.jar com.voidclient.mobile.MobileBridge | grep 'insertText'
          java -Djava.awt.headless=true -jar client/build/libs/void-client-jarrunner-mobile.jar --help | grep 'JR1'
          unzip -p client/build/libs/void-client-0.3.0-release.jar META-INF/MANIFEST.MF | grep 'Main-Class: Loader'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-client-mobile-verification
          path: |
            client/build/reports/tests/
            client/build/reports/mobile/
            client/build/test-results/
            client/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7
