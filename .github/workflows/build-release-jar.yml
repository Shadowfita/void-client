name: Build verified release jar

on:
  push:
    branches:
      - build/release-jar

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release jar through ProGuard
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Stage and verify release jar
        shell: bash
        run: |
          set -euo pipefail
          src="client/build/libs/void-client-0.1.1-release.jar"
          dst="release/void-client-0.1.1-shadowfita.jar"
          mkdir -p release
          cp "$src" "$dst"

          echo '=== Manifest ==='
          unzip -p "$dst" META-INF/MANIFEST.MF | tee /tmp/manifest.txt
          grep -F 'Main-Class: Loader' /tmp/manifest.txt

          echo '=== Wheel handler ==='
          jar tf "$dst" | grep -Fx 'Class373_Sub1.class'
          javap -classpath "$dst" -p Class373_Sub1 | tee /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt

          sha256sum "$dst" | tee "$dst.sha256"

      - name: Upload verified jar
        uses: actions/upload-artifact@v4
        with:
          name: void-client-0.1.1-shadowfita
          path: |
            release/void-client-0.1.1-shadowfita.jar
            release/void-client-0.1.1-shadowfita.jar.sha256
          if-no-files-found: error
          compression-level: 0
