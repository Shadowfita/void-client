name: QoL upgrade verification

on:
  push:
    branches:
      - feature/runelite-qol-modern-shell
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Assemble and apply pending implementation
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .github/qol-patch ]]; then
            cat .github/qol-patch/part-* | base64 --decode | gzip --decompress > /tmp/qol.patch
            echo "99c8fa89fdc2c0a9505dd92da766e6bf0c228201c16c648ee06cf6b913446c75  /tmp/qol.patch" | sha256sum --check
            git apply --check /tmp/qol.patch
            git apply --index /tmp/qol.patch
            git rm -r .github/qol-patch
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile client
        run: ./gradlew :client:compileJava --stacktrace

      - name: Run tests
        run: ./gradlew :client:test --stacktrace

      - name: Build release jar
        run: ./gradlew :client:proguardJar --stacktrace

      - name: Commit verified implementation
        if: steps.patch.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add RuneLite QoL plugins and modern shell"
          git push origin HEAD:feature/runelite-qol-modern-shell

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: void-client-qol-release
          path: client/build/libs/*release.jar
          if-no-files-found: error
          retention-days: 7
