name: Export v0.3.1 working source

on:
  push:
    branches:
      - fix/v0.3.1-scaling-projection-defaults
    paths:
      - '.github/workflows/export-v031-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: void-client-v031-source
          path: |
            .
            !.git
            !**/build
            !out
          include-hidden-files: true
          retention-days: 2
