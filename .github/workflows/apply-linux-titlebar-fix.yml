name: Apply Linux single-titlebar fix

on:
  push:
    branches:
      - fix/linux-single-window-bar
    paths:
      - '.github/workflows/apply-linux-titlebar-fix.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply window-shell correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/src/net/runelite/client/ui/ClientUI.java')
          text = path.read_text()

          replacements = [
              (
                  'final boolean inTitle = !event.getButton().isTab() && withTitleBar;',
                  'final boolean inTitle = false; // Keep navigation in the persistent side toolbar; the OS/FlatLaf owns the sole titlebar.'
              ),
              (
                  '''\t\t\ttitleToolbar = new ClientTitleToolbar();\n\t\t\tJPanel shellBar = new JPanel(new BorderLayout());\n\t\t\tshellBar.setBackground(ColorScheme.DARKER_GRAY_COLOR);\n\t\t\tshellBar.setBorder(BorderFactory.createMatteBorder(0, 0, 1, 0, ColorScheme.BORDER_COLOR));\n\t\t\tJLabel shellTitle = new JLabel(title);\n\t\t\tshellTitle.setForeground(ColorScheme.TEXT_COLOR);\n\t\t\tshellTitle.setFont(shellTitle.getFont().deriveFont(Font.BOLD));\n\t\t\tshellTitle.setBorder(BorderFactory.createEmptyBorder(0, 8, 0, 8));\n\t\t\tshellBar.add(shellTitle, BorderLayout.WEST);\n\t\t\tshellBar.add(titleToolbar, BorderLayout.EAST);\n\t\t\tcontainer.add(shellBar, BorderLayout.NORTH);''',
                  '''\t\t\ttitleToolbar = new ClientTitleToolbar();\n\t\t\t// Do not add a second in-client title strip. Linux/Windows native chrome or\n\t\t\t// FlatLaf custom chrome is the single window titlebar; navigation lives in\n\t\t\t// the persistent vertical plugin toolbar instead.'''
              ),
              (
                  'titleToolbar.addComponent(sidebarNavigationButton, sidebarNavigationJButton);',
                  'pluginToolbar.addComponent(sidebarNavigationButton, sidebarNavigationJButton);'
              ),
              (
                  '''\t\tif (sidebarOpen)\n\t\t{\n\t\t\tframe.expandBy(pluginToolbar.getWidth());\n\t\t}\n\t\telse\n\t\t{\n\t\t\tframe.contractBy(pluginToolbar.getWidth());\n\t\t}''',
                  '''\t\t// The vertical toolbar remains visible in both states, so toggling a\n\t\t// plugin panel must not resize the frame by the toolbar width.'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected ClientUI source block not found:\n' + old[:160])
              text = text.replace(old, new, 1)

          # Modern RuneLite keeps the navigation strip visible even when no plugin
          # panel is open. This also guarantees a visible way to reopen the sidebar.
          count = text.count('pluginToolbar.setVisible(false);')
          if count < 1:
              raise SystemExit('Expected hidden plugin-toolbar calls were not found')
          text = text.replace('pluginToolbar.setVisible(false);', 'pluginToolbar.setVisible(true);')

          path.write_text(text)
          PY

          git diff --check
          ! grep -q 'container.add(shellBar, BorderLayout.NORTH)' client/src/net/runelite/client/ui/ClientUI.java
          grep -q 'pluginToolbar.addComponent(sidebarNavigationButton, sidebarNavigationJButton)' client/src/net/runelite/client/ui/ClientUI.java

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: |
          ./gradlew :client:compileJava --no-daemon --stacktrace
          ./gradlew :client:test --no-daemon --stacktrace

      - name: Build release JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify release regression guards
        shell: bash
        run: |
          jar_path='client/build/libs/void-client-0.2.0-release.jar'
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt

      - name: Commit verified correction
        shell: bash
        run: |
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add client/src/net/runelite/client/ui/ClientUI.java
          git rm .github/workflows/apply-linux-titlebar-fix.yml
          git commit -m 'Fix duplicate desktop titlebar and persist side navigation'
          git push origin HEAD:fix/linux-single-window-bar
