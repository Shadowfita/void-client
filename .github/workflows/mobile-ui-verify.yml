name: Mobile UI verification

on:
  push:
    branches: [feature/mobile-responsive-ui]
  pull_request:
    branches: [feature/mobile-responsive-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source snapshot
        run: git archive --format=zip --output=mobile-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: void-client-mobile-source
          path: mobile-source.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile and test
        run: bash ./gradlew :client:compileJava :client:test --stacktrace
      - name: Build obfuscated release
        run: bash ./gradlew :client:proguardJar --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-client-mobile-verification
          path: |
            client/build/reports/tests/
            client/build/test-results/
            client/build/libs/*release.jar
          if-no-files-found: warn
          retention-days: 7
