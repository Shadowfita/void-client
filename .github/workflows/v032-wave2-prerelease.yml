name: Package verified v0.3.2 wave 2 prerelease

on:
  push:
    branches:
      - fix/v0.3.2-plugin-remediation-wave2
    paths:
      - '.github/workflows/v032-wave2-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out verified branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify branch before cleanup
        run: ./gradlew clean :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Require real conformance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('client/build/test-results/test').glob('TEST-*.xml'))
          tests = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          print(f'tests={tests}, failures={failures}, errors={errors}')
          if tests < 10 or failures or errors:
              raise SystemExit('Wave 2 deterministic tests did not pass')
          PY

      - name: Remove one-shot packaging workflow and commit clean source
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git rm .github/workflows/v032-wave2-prerelease.yml
          git commit -m 'ci: finalize clean v0.3.2 wave 2 source'
          git push origin HEAD:fix/v0.3.2-plugin-remediation-wave2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild exact clean commit
        run: ./gradlew clean :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Verify and stage assets
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.2-release.jar'
          test -f "$jar_path"
          unzip -t "$jar_path" >/dev/null
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.2'

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('client/build/test-results/test').glob('TEST-*.xml'))
          tests = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          if tests < 10 or failures or errors:
              raise SystemExit('Post-cleanup deterministic tests failed')
          Path('/tmp/test-count').write_text(str(tests))
          PY

          mkdir -p release
          cp "$jar_path" release/void-client-0.3.2-wave2-rc1.jar
          sha256sum release/void-client-0.3.2-wave2-rc1.jar \
            > release/void-client-0.3.2-wave2-rc1.jar.sha256
          {
            echo 'branch=fix/v0.3.2-plugin-remediation-wave2'
            echo 'source_sha=${{ steps.clean.outputs.sha }}'
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "deterministic_tests=$(cat /tmp/test-count)"
            echo 'scope=explicit capability and event conformance; authoritative container and widget-slot snapshots; independent projection canaries; diagnostics; fail-closed Tile Indicators and NPC Names'
          } > release/void-client-0.3.2-wave2-rc1.build-info

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v0.3.2-wave2-rc1'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace an unverified target." >&2
            exit 1
          fi
          cat > /tmp/notes.md <<'EOF'
          ## v0.3.2 remediation wave 2 release candidate

          This prerelease adds the explicit 634 compatibility-conformance substrate:

          - runtime capability states with evidence;
          - direct/polled event accounting and duplicate/thread diagnostics;
          - exact native inventory/bank roles and immutable visible-slot snapshots;
          - ambiguity and partial-frame rejection;
          - independent native actor projection references;
          - tile and actor projection calibration canaries;
          - opt-in Compatibility Diagnostics UI;
          - fail-closed Tile Indicators and NPC Names;
          - ten executable deterministic conformance tests.

          Wider world-space plugin qualification remains intentionally deferred until the canaries pass on Linux/JAGGL.
          EOF
          gh release create "$tag" release/* \
            --target '${{ steps.clean.outputs.sha }}' \
            --title 'Void Client v0.3.2 Wave 2 RC1' \
            --notes-file /tmp/notes.md \
            --prerelease

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-client-v0.3.2-wave2-rc1
          path: release/
          if-no-files-found: error
          retention-days: 14
