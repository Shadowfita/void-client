# Modern RuneLite-inspired FlatLaf defaults.
@background=@DARK_GRAY
@foreground=@TEXT
@accentColor=@BRAND_ORANGE
@buttonBackground=@CONTROL
@componentBackground=@CONTROL
@menuBackground=lighten(@background,4%)
@selectionBackground=@MEDIUM_GRAY

Button.arc=0
Button.background=@buttonBackground
Button.foreground=#ffffff
Button.borderColor=@BORDER
Button.focusedBorderColor=@BRAND_ORANGE
Button.hoverBackground=lighten(@buttonBackground,8%)
Button.pressedBackground=lighten(@buttonBackground,12%)
Button.selectedBackground=lighten(@buttonBackground,10%)

[style]Button.iconButton=rolloverIconAlpha:0.72; border:null; buttonType:"borderless"
[style]ToggleButton.iconButton=$[style]Button.iconButton
[style]CheckBox.iconButton=rolloverIconAlpha:0.72; border:null

CheckBox.icon.background=@CONTROL
CheckBox.icon.borderColor=@BORDER
CheckBox.icon.selectedBorderColor=@BORDER
CheckBox.icon.checkmarkColor=#ffffff
CheckBox.icon.size=18
CheckBox.icon.focusWidth=0
CheckBox.arc=0

Component.arc=0
Component.borderColor=@BORDER
Component.focusedBorderColor=@BRAND_ORANGE
Component.innerFocusWidth=0
Component.innerOutlineWidth=0

MenuBar.background=@DARKER_GRAY
MenuItem.selectionBackground=@MEDIUM_GRAY
MenuItem.selectionForeground=#ffffff
PopupMenu.background=@menuBackground

Panel.background=@background
ProgressBar.arc=0
ProgressBar.background=@CONTROL
ProgressBar.foreground=@BRAND_ORANGE

ScrollBar.track=@SCROLL_TRACK
ScrollBar.thumb=@MEDIUM_GRAY
ScrollBar.hoverThumbColor=lighten(@MEDIUM_GRAY,10%)
ScrollBar.pressedThumbColor=lighten(@MEDIUM_GRAY,18%)
ScrollBar.width=8
ScrollBar.showButtons=false
ScrollPane.border=0,0,0,0

Separator.foreground=@BORDER
Spinner.buttonBackground=$Spinner.background
TabbedPane.background=@DARKER_GRAY
TabbedPane.contentAreaColor=@DARK_GRAY
TabbedPane.focusColor=@DARK_GRAY
TabbedPane.hoverColor=lighten(@DARK_GRAY,8%)
TabbedPane.selectedBackground=@DARK_GRAY
TabbedPane.underlineColor=@BRAND_ORANGE
TabbedPane.inactiveUnderlineColor=@MEDIUM_GRAY
TabbedPane.tabHeight=27
TabbedPane.showTabSeparators=true

TextArea.background=@CONTROL
TextArea.foreground=@TEXT
TextComponent.selectionBackground=@BRAND_ORANGE_TRANSPARENT
TextComponent.selectionForeground=#ffffff
TextField.background=@CONTROL
TextField.foreground=@TEXT
TextField.caretForeground=@TEXT
TextPane.background=@CONTROL
TextPane.foreground=@TEXT

TitlePane.background=@DARKER_GRAY
TitlePane.foreground=@TEXT
TitlePane.inactiveBackground=@DARKER_GRAY
TitlePane.inactiveForeground=@LIGHT_GRAY
TitlePane.buttonSize=34,24
ToolBar.background=@DARKER_GRAY
ToolTip.background=@menuBackground
ToolTip.foreground=@TEXT
