name: Verify persistent scaled UI redraw hotfix

on:
  push:
    branches:
      - hotfix/ui-scale-persistent-hud
    paths:
      - '.github/workflows/apply-persistent-scaled-ui-hotfix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scaled UI redraw fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/Applet_Sub1.java')
          s = p.read_text()
          old = '''        if (Class348_Sub8.aHa6654 != null) {
            Class348_Sub8.aHa6654.refreshNativeInterfaceScaling();
        }
    }

    static boolean suspendInterfaceRenderScale() {'''
          new = '''        if (Class348_Sub8.aHa6654 != null) {
            Class348_Sub8.aHa6654.refreshNativeInterfaceScaling();
        }

        // The 634 resizable interface relies on dirty rectangles because the
        // continuously rendered 3D viewport can overlap transparent HUD/chat
        // widgets. Native fractional UI scaling moves those rectangles between
        // logical and physical coordinate spaces, and a missed overlap leaves
        // the viewport able to overwrite the HUD until another full resize.
        // Keep the scaled UI dirty so those lightweight widgets are composited
        // every frame while native interface scaling is active.
        for (int i = 0; i < Class152.aBooleanArray2076.length; i++) {
            Class152.aBooleanArray2076[i] = true;
        }
    }

    static boolean suspendInterfaceRenderScale() {'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one endInterfaceRenderScale block, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -n -A15 -B5 'Keep the scaled UI dirty' client/src/Applet_Sub1.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: |
          ./gradlew :client:compileJava --no-daemon --stacktrace
          ./gradlew :client:test --no-daemon --stacktrace

      - name: Build ProGuard JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify and stage test JAR
        shell: bash
        run: |
          jar_path='client/build/libs/void-client-0.2.0-release.jar'
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt
          mkdir -p release debug
          cp "$jar_path" release/void-client-0.2.0-ui-persistence-hotfix.jar
          (cd release && sha256sum void-client-0.2.0-ui-persistence-hotfix.jar > void-client-0.2.0-ui-persistence-hotfix.jar.sha256)
          printf '%s\n' '${{ github.run_id }}' > debug/latest-ui-persistence-run-id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: void-client-ui-persistence-hotfix
          path: |
            release/void-client-0.2.0-ui-persistence-hotfix.jar
            release/void-client-0.2.0-ui-persistence-hotfix.jar.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add client/src/Applet_Sub1.java debug/latest-ui-persistence-run-id.txt
          git rm .github/workflows/apply-persistent-scaled-ui-hotfix.yml
          git commit -m 'Keep native-scaled HUD and chat composited'
          git push origin HEAD:hotfix/ui-scale-persistent-hud
