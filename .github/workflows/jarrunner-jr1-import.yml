name: Jar Runner JR1 source import and verification

# Temporary, branch-scoped source transfer for this change only. Removed after successful import.
on:
  push:
    branches: [feature/mobile-responsive-ui]
    paths: [.github/workflows/jarrunner-jr1-import.yml]
permissions:
  contents: write
jobs:
  import-and-verify:
    if: github.repository == 'Shadowfita/void-client' && github.ref == 'refs/heads/feature/mobile-responsive-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check base and apply exact locally tested source
        run: |
          git diff --exit-code 47e90022b46157d3538cd6686f4bdeed3d4759e5 HEAD -- client docs
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = b''.join(pathlib.Path('.maintenance/jr1-payload', str(i)).read_bytes() for i in range(7))
          assert len(encoded) == 24900, 'Source transfer length mismatch'
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(data) == 69326, 'Patch length mismatch'
          assert hashlib.sha256(data).hexdigest() == '2c01305941b62835be0931fdd646edd30d7dae41beb1ac1c76aaf034413a75e6', 'Patch integrity failure'
          patch = pathlib.Path(os.environ['RUNNER_TEMP'], 'void-jr1.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', '--whitespace=nowarn', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=nowarn', str(patch)], check=True)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core native and browser regression tests
        run: |
          node --test web/mobile/test/*.test.mjs
          bash ./gradlew :client:compileJava :client:test --stacktrace
      - name: Actual standalone Swing host tests
        run: xvfb-run -a -s '-screen 0 1920x1200x24' bash ./gradlew --no-daemon :client:standaloneHostTest --stacktrace
      - name: Obfuscated release and dedicated Jar Runner build
        run: bash ./gradlew :client:proguardJar :client:jarRunnerJar --stacktrace
      - name: Actual obfuscated entry point and portrait setup test
        run: |
          xvfb-run -a -s '-screen 0 390x844x24' bash ./gradlew --no-daemon :client:standaloneReleaseTest --stacktrace
          java -Djava.awt.headless=true -jar client/build/libs/void-client-jarrunner-mobile.jar --help | grep JR1
          unzip -p client/build/libs/void-client-0.3.0-release.jar META-INF/MANIFEST.MF | grep 'Main-Class: Loader'
          javap -classpath client/build/libs/void-client-0.3.0-release.jar MobileLauncher | grep setDisplayScale
      - name: Commit and fast-forward only the requested feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git add -- client docs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(mobile): add display-aware Jar Runner launcher, scaling and input profiles with regression tests'
          git fetch origin feature/mobile-responsive-ui
          test "$(git rev-parse origin/feature/mobile-responsive-ui)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feature/mobile-responsive-ui
          git rev-parse HEAD > jr1-build-commit.txt
          git archive --format=zip --output=jr1-source.zip HEAD
          sha256sum client/build/libs/void-client-jarrunner-mobile.jar > jr1-jar-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-client-jarrunner-jr1-build
          path: |
            client/build/libs/*.jar
            client/build/reports/mobile/
            client/build/reports/tests/
            client/build/test-results/
            jr1-build-commit.txt
            jr1-jar-sha256.txt
            jr1-source.zip
          if-no-files-found: warn
          retention-days: 7
