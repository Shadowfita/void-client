name: Export current v0.3.1 source

on:
  push:
    branches:
      - fix/v0.3.1-scaling-projection-defaults
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: void-client-v031-current-source
          path: |
            .
            !.git
            !**/build
            !out
          include-hidden-files: true
          # Keep diagnostic source snapshots available alongside test builds.
          retention-days: 7
