name: Apply JAGGL resize-thread hotfix

on:
  push:
    branches:
      - hotfix/jaggl-resize-threading
    paths:
      - '.github/workflows/apply-jaggl-resize-thread-hotfix.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ClientUI threading
        run: |
          python3 .tmp/apply_jaggl_resize_hotfix.py
          git diff --check
          grep -F 'clientThread.invokeLater(() -> gameClient.invalidateStretching(true));' client/src/net/runelite/client/ui/ClientUI.java

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: |
          ./gradlew :client:compileJava --no-daemon --stacktrace
          ./gradlew :client:test --no-daemon --stacktrace

      - name: Build release JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify release regression guards
        run: |
          jar_path='client/build/libs/void-client-0.2.0-release.jar'
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt

      - name: Stage test artifact
        run: |
          mkdir -p release
          cp client/build/libs/void-client-0.2.0-release.jar release/void-client-0.2.0-jaggl-resize-hotfix.jar
          (cd release && sha256sum void-client-0.2.0-jaggl-resize-hotfix.jar > void-client-0.2.0-jaggl-resize-hotfix.jar.sha256)

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-client-jaggl-resize-hotfix
          path: |
            release/void-client-0.2.0-jaggl-resize-hotfix.jar
            release/void-client-0.2.0-jaggl-resize-hotfix.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified hotfix
        run: |
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add client/src/net/runelite/client/ui/ClientUI.java
          git rm .tmp/apply_jaggl_resize_hotfix.py
          git rm .github/workflows/apply-jaggl-resize-thread-hotfix.yml
          git commit -m 'Fix JAGGL resize calls on Swing event thread'
          git push origin HEAD:hotfix/jaggl-resize-threading
