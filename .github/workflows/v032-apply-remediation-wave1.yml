name: Apply v0.3.2 remediation wave 1

on:
  push:
    branches:
      - fix/v0.3.2-plugin-remediation-wave1
    paths:
      - '.github/workflows/v032-apply-remediation-wave1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source remediations
        run: python3 tools/apply_v032_remediation_wave1.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'rollbackFailedStart' client/src/net/runelite/client/plugins/PluginManager.java
          grep -F 'return "index:" + npc.getIndex();' client/src/net/runelite/client/game/GameStateBridge.java
          grep -F 'base <= 0 || current <= 0' client/src/net/runelite/client/plugins/idlenotifier/IdleNotifierPlugin.java
          grep -F 'private volatile String searchQuery' client/src/net/runelite/client/plugins/banktags/BankTagsPlugin.java
          grep -F 'inventoryItems.size() < INVENTORY_SIZE || draggedItem == null' client/src/net/runelite/client/plugins/inventorygrid/InventoryGridOverlay.java
          grep -F 'catch (UnsatisfiedLinkError unsupportedJagglReadback)' client/src/Class258_Sub3_Sub1.java
          grep -F 'Runtime artifact:' client/src/net/runelite/client/RuneLite.java

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean compile, test and build release JAR
        run: ./gradlew clean :client:compileJava :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.2-release.jar'
          test -f "$jar_path"
          unzip -t "$jar_path" >/dev/null
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.2'
          javap -classpath "$jar_path" -p net.runelite.client.util.BuildIdentity \
            | grep -F 'public static java.lang.String describe(java.lang.Class<?>);'

          rm -rf /tmp/v032-release
          mkdir -p /tmp/v032-release
          unzip -q "$jar_path" -d /tmp/v032-release
          grep -R -l -a -F 'glGetTexImageub' /tmp/v032-release --include='*.class' \
            | sort | sed 's#^/tmp/v032-release/##' > /tmp/v032-readback-candidates.txt || true
          while IFS= read -r class_file; do
            [ -n "$class_file" ] || continue
            class_name="${class_file%.class}"
            class_name="${class_name//\//.}"
            [ "$class_name" = 'jaggl.OpenGL' ] && continue
            if javap -classpath "$jar_path" -c -p "$class_name" 2>/dev/null \
              | grep -F 'jaggl/OpenGL.glGetTexImageub' >/dev/null; then
              echo "Unsupported executable JAGGL readback caller remains: $class_name" >&2
              exit 1
            fi
          done < /tmp/v032-readback-candidates.txt

      - name: Commit verified remediation source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add client release-notes/v0.3.2.md
          git rm \
            tools/apply_v032_remediation_wave1.py \
            .github/workflows/v032-remediation-diagnostic.yml \
            .github/workflows/v032-apply-remediation-wave1.yml
          git commit -m 'Begin v0.3.2 plugin remediation'
          git push origin HEAD:fix/v0.3.2-plugin-remediation-wave1

      - name: Stage verified test build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp client/build/libs/void-client-0.3.2-release.jar \
            release/void-client-0.3.2-remediation-wave1.jar
          sha256sum release/void-client-0.3.2-remediation-wave1.jar \
            > release/void-client-0.3.2-remediation-wave1.jar.sha256
          {
            echo 'branch=fix/v0.3.2-plugin-remediation-wave1'
            echo "source_sha=$(git rev-parse HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo 'scope=transactional lifecycle; stable NPC identity; scene reset; valid vital baselines; Bank Tags thread ownership; Inventory Grid null safety; JAGGL fallback; runtime JAR fingerprint'
          } > release/void-client-0.3.2-remediation-wave1.build-info

      - name: Upload verified remediation build
        uses: actions/upload-artifact@v4
        with:
          name: void-client-v0.3.2-remediation-wave1
          path: release/
          if-no-files-found: error
          retention-days: 7
