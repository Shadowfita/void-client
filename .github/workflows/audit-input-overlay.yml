name: Audit native input and overlay hooks

on:
  push:
    branches:
      - hotfix/jaggl-resize-threading
    paths:
      - '.github/workflows/audit-input-overlay.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture call sites
        run: |
          mkdir -p debug
          grep -RniE 'scaleInterfaceInputX|scaleInterfaceInputY|physicalToInterfaceX|physicalToInterfaceY' client/src > debug/interface-input-scale-calls.txt || true
          grep -RniE 'getCallbacks\(\)|Callbacks|drawScene\(|drawAboveOverheads\(|drawInterface\(|drawLayer\(' client/src > debug/callback-overlay-calls.txt || true
          grep -RniE 'method3597\(|method3594\(' client/src/client.java client/src/Class*.java > debug/raw-mouse-coordinate-calls.txt || true
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add debug/interface-input-scale-calls.txt debug/callback-overlay-calls.txt debug/raw-mouse-coordinate-calls.txt
          git rm .github/workflows/audit-input-overlay.yml
          git commit -m 'debug: audit native input and overlay call sites'
          git push origin HEAD:hotfix/jaggl-resize-threading
