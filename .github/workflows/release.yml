name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == release/v* ]]; then
            tag="${GITHUB_REF_NAME#release/}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout main release source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle version matches tag
        shell: bash
        run: |
          gradle_version=$(grep -oP 'version\s*=\s*"\K[^"]+' client/build.gradle.kts)
          if [ "$gradle_version" != "${{ steps.release.outputs.version }}" ]; then
            echo "Version mismatch: tag=${{ steps.release.outputs.version }}, gradle=$gradle_version" >&2
            exit 1
          fi

      - name: Build and obfuscate JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify release JAR
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          jar_path="client/build/libs/void-client-${version}-release.jar"
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt

      - name: Stage release artifact and checksum
        id: artifact
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          src="client/build/libs/void-client-${version}-release.jar"
          mkdir -p release
          cp "$src" "release/void-client-${version}.jar"
          (cd release && sha256sum "void-client-${version}.jar" > "void-client-${version}.jar.sha256")
          echo "jar=release/void-client-${version}.jar" >> "$GITHUB_OUTPUT"
          echo "sha=release/void-client-${version}.jar.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes="release-notes/${tag}.md"
          test -f "$notes"
          target=$(git rev-parse HEAD)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${{ steps.artifact.outputs.jar }}" \
              "${{ steps.artifact.outputs.sha }}"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "$tag" \
              --notes-file "$notes" \
              "${{ steps.artifact.outputs.jar }}" \
              "${{ steps.artifact.outputs.sha }}"
          fi
