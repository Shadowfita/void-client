name: Export fractional UI source

on:
  push:
    branches:
      - feature/fractional-ui-pixel-supersampling
    paths:
      - '.github/workflows/export-fractional-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: fractional-ui-source-export
          path: |
            .
            !.git
            !**/build
            !out
          include-hidden-files: true
          retention-days: 1
