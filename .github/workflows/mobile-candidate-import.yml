name: Import and verify JR2-JR5 candidate
on:
  push:
    branches: [feature/mobile-responsive-ui]
    paths: [.github/workflows/mobile-candidate-import.yml]
permissions:
  contents: write
jobs:
  import-and-verify:
    if: github.repository == 'Shadowfita/void-client'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and integrity of locally tested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = a429a8732cb6280a927d27349b02c2cb0809fa72
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          data=b''.join(pathlib.Path('.maintenance/mobile-candidate',str(i)).read_bytes() for i in range(7))
          assert hashlib.sha256(data).hexdigest()=='daa6745f5d053d5978ef43cac895806694b1eeb1ee585a0011db69b63400af2c', 'Encoded transfer mismatch'
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert len(patch)==251892 and hashlib.sha256(patch).hexdigest()=='2f3eb976e64f5c0324c8bb9c038c57cd073af72a5017d289031b13470e4a4789', 'Source patch mismatch'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - uses: actions/checkout@v4
        with:
          repository: GregHib/void
          ref: d165e5be63e3232f64f08230448089a454bd35e6
          path: .maintenance/public-void
          persist-credentials: false
          sparse-checkout: data
      - name: Regenerate metadata from pinned public source only
        shell: bash
        run: |
          python3 tools/mobile/generate_interface_registry.py .maintenance/public-void client/resources/mobile/interface-registry.json
          echo '3fda900165bbe6be438c6fdf40420cc1efd56420d23be8e6e49850eb881c8453  client/resources/mobile/interface-registry.json' | sha256sum -c -
          rm -rf .maintenance/public-void
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser regression tests
        run: node --test web/mobile/test/*.test.mjs
      - name: Full Java 8 compile and core, adversarial and native workflow tests
        run: bash ./gradlew :client:compileJava :client:test --stacktrace
      - name: Actual standalone and responsive Swing tests
        run: xvfb-run -a -s '-screen 0 1920x1200x24' bash ./gradlew --no-daemon :client:standaloneHostTest :client:responsiveHostTest --stacktrace
      - name: Build obfuscated desktop and Jar Runner artifacts
        run: bash ./gradlew :client:proguardJar :client:jarRunnerJar --stacktrace
      - name: Test actual obfuscated startup and responsive controls
        run: xvfb-run -a -s '-screen 0 390x844x24' bash ./gradlew --no-daemon :client:standaloneReleaseTest :client:releasedMobileUiTest --stacktrace
      - name: Verify release entry points and archive integrity
        run: |
          javap -classpath client/build/libs/void-client-0.3.0-release.jar MobileLauncher | grep 'setDisplayScale'
          javap -classpath client/build/libs/void-client-0.3.0-release.jar com.voidclient.mobile.MobileBridge | grep 'insertText'
          java -Djava.awt.headless=true -jar client/build/libs/void-client-jarrunner-mobile.jar --help | grep 'JR2'
          unzip -p client/build/libs/void-client-0.3.0-release.jar META-INF/MANIFEST.MF | grep 'Main-Class: Loader'
          unzip -t client/build/libs/void-client-jarrunner-mobile.jar
          sha256sum client/build/libs/*.jar | tee client/build/reports/mobile/SHA256SUMS.txt
      - name: Commit only tested application source to the requested feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow publication/cleanup is performed separately by the authorised GitHub connector.
          # The build token writes application source only, within its contents permission.
          git restore .github/workflows/mobile-ui-verify.yml
          git rm .maintenance/mobile-candidate/*
          git add README.md client/src client/test client/resources/mobile client/build.gradle.kts docs/mobile-jr2-jr5-candidate.md tools/mobile
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git diff --cached --stat
          git fetch origin feature/mobile-responsive-ui
          test "$(git rev-parse origin/feature/mobile-responsive-ui)" = "$GITHUB_SHA"
          git commit -m 'feat(mobile): add JR2 correctness fixes and JR3-JR5 responsive interface candidate'
          git push origin HEAD:refs/heads/feature/mobile-responsive-ui
          git rev-parse HEAD | tee client/build/reports/mobile/SOURCE_COMMIT.txt
          git archive --format=zip --output=mobile-candidate-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: void-mobile-candidate-build
          path: |
            mobile-candidate-source.zip
            client/build/reports/
            client/build/test-results/
            client/build/proguard/mapping.txt
            client/build/libs/*.jar
          retention-days: 7
          if-no-files-found: warn
