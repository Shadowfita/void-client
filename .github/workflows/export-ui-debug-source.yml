name: Export UI debug source

on:
  push:
    branches:
      - hotfix/jaggl-resize-threading
    paths:
      - '.github/workflows/export-ui-debug-source.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect UI scale call sites
        shell: bash
        run: |
          mkdir -p debug
          grep -RniE 'beginInterfaceRenderScale|endInterfaceRenderScale|suspendInterfaceRenderScale|resumeInterfaceRenderScale|refreshNativeInterfaceScaling|interfaceRenderScaleActive|setInterfaceDirtyBounds' client/src > debug/ui-scale-call-sites.txt || true
          grep -RniE 'Class152\.aBooleanArray2076|Class49\.aBoolean4726|method1373\(|method1630\(' client/src > debug/ui-dirty-call-sites.txt || true
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add debug/ui-scale-call-sites.txt debug/ui-dirty-call-sites.txt
          git commit -m 'debug: capture UI scale render call sites'
          git push origin HEAD:hotfix/jaggl-resize-threading
