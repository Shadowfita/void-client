name: Fractional UI pixel supersampling

on:
  push:
    branches:
      - feature/fractional-ui-pixel-supersampling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export source
        uses: actions/upload-artifact@v4
        with:
          name: fractional-ui-source
          path: |
            .
            !.git
            !**/build
            !out
          include-hidden-files: true
          retention-days: 1

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile client
        run: ./gradlew :client:compileJava --no-daemon --stacktrace

      - name: Run tests
        run: ./gradlew :client:test --no-daemon --stacktrace

      - name: Build release JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace
