name: Apply and verify v0.3.2 remediation wave 2

on:
  push:
    branches:
      - fix/v0.3.2-plugin-remediation-wave2
    paths:
      - '.github/workflows/v032-apply-remediation-wave2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.tmp/wave2-payload.part*)
          if (( ${#parts[@]} < 2 )); then
            echo 'Wave 2 payload parts are incomplete.' >&2
            exit 1
          fi

          cat "${parts[@]}" > /tmp/wave2-payload.b64
          if grep -q '[^A-Za-z0-9+/=]' /tmp/wave2-payload.b64; then
            echo 'Payload contains non-base64 characters.' >&2
            exit 1
          fi
          base64 --decode /tmp/wave2-payload.b64 > /tmp/wave2-payload.tar.gz
          gzip -t /tmp/wave2-payload.tar.gz

          tar -tzf /tmp/wave2-payload.tar.gz > /tmp/wave2-paths.txt
          python3 - <<'PY'
          from pathlib import PurePosixPath
          paths = [line.strip() for line in open('/tmp/wave2-paths.txt', encoding='utf-8') if line.strip()]
          if len(paths) < 40:
              raise SystemExit(f'Payload unexpectedly contains only {len(paths)} paths')
          for raw in paths:
              path = PurePosixPath(raw)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'Unsafe payload path: {raw}')
          required = {
              'client/src/net/runelite/client/compatibility/ClientCapabilityService.java',
              'client/src/net/runelite/client/compatibility/EventConformance.java',
              'client/src/net/runelite/client/compatibility/ProjectionCalibrationService.java',
              'client/src/net/runelite/client/game/ItemSnapshotService.java',
              'client/src/net/runelite/client/game/WidgetItemSnapshotStore.java',
              'client/src/net/runelite/client/plugins/compatibilitydiagnostics/CompatibilityDiagnosticsPlugin.java',
              'client/tests/net/runelite/client/compatibility/EventConformanceTest.java',
              'client/tests/net/runelite/client/compatibility/ProjectionCalibrationTest.java',
              'client/tests/net/runelite/client/game/ItemSnapshotResolverTest.java',
          }
          missing = sorted(required.difference(paths))
          if missing:
              raise SystemExit('Payload is missing required paths: ' + ', '.join(missing))
          print(f'Validated {len(paths)} payload paths')
          PY

          tar -xzf /tmp/wave2-payload.tar.gz -C .

          git rm -f client/src/net/runelite/client/plugins/inventorygrid/InventoryGridCanvasOverlay.java
          git rm -f .tmp/wave2-payload.part*
          git rm -f .github/workflows/v032-wave2-source-export.yml
          git rm -f .github/workflows/v032-apply-remediation-wave2.yml

      - name: Verify source contracts before compilation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          test ! -e client/src/net/runelite/client/plugins/inventorygrid/InventoryGridCanvasOverlay.java
          grep -F 'testImplementation("junit:junit:4.13.2")' client/build.gradle.kts
          grep -F 'java.srcDirs("tests")' client/build.gradle.kts

          grep -F 'enum ClientCapability' client/src/net/runelite/client/compatibility/ClientCapability.java
          grep -F 'class ClientCapabilityService' client/src/net/runelite/client/compatibility/ClientCapabilityService.java
          grep -F 'class EventConformance' client/src/net/runelite/client/compatibility/EventConformance.java
          grep -F 'EventOrigin.DIRECT' client/src/net/runelite/client/game/GameEventBridgeHooks.java
          grep -F 'EventOrigin.POLLED' client/src/net/runelite/client/game/GameStateBridge.java

          grep -F 'WidgetItemSnapshotStore.beginFrame' client/src/Class302.java
          grep -F 'WidgetItemSnapshotStore.abortFrame' client/src/Class302.java
          grep -F 'captureRuneLiteWidgetItem' client/src/Class348_Sub40_Sub7.java
          grep -F 'Multiple native widget groups matched equally' client/src/net/runelite/client/game/ItemSnapshotResolver.java
          grep -F 'return client == null ? null : client.getItemContainer(ItemContainerRole.INVENTORY);' client/src/net/runelite/client/plugins/qol/QolItemContainers.java

          grep -F '@RequiresCapabilities(ClientCapability.NATIVE_SCENE_PROJECTION)' client/src/net/runelite/client/plugins/tileindicators/TileIndicatorsPlugin.java
          grep -F 'ClientCapability.ACTOR_OVERHEAD_PROJECTION' client/src/net/runelite/client/plugins/npcnames/NpcNamesPlugin.java
          grep -F 'getNativeLocalPlayerProjection' client/src/Applet_Sub1.java
          grep -F 'getNativeNpcProjection' client/src/Applet_Sub1.java

          python3 - <<'PY'
          from pathlib import Path
          hooks = Path('client/src/net/runelite/client/game/GameEventBridgeHooks.java').read_text()
          start = hooks.index('public static void postChatMessage(Object type')
          end = hooks.index('public static void postChatMessage(Object messageNode', start)
          block = hooks[start:end]
          assert block.count('post(new ChatMessage') == 1, 'duplicate chat event producer remains'

          packets = Path('client/src/Class348_Sub42_Sub8_Sub2.java').read_text()
          assert packets.count('GameEventBridgeHooks.postItemContainerChanged') >= 2, \
              'full and partial item-container packet hooks were not both installed'

          resolver = Path('client/src/net/runelite/client/game/ItemSnapshotResolver.java').read_text()
          assert 'frame.isComplete()' in resolver
          assert 'idMismatches == 0' in resolver

          q = Path('client/src/net/runelite/client/plugins/qol/QolItemContainers.java').read_text()
          assert 'getCapacity() == 28' not in q
          assert 'getCapacity() > 28' not in q
          print('Static source contracts passed')
          PY

      - name: Set up Java 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, execute deterministic tests, and build ProGuard JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :client:compileJava :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Verify deterministic test execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path('client/build/test-results/test').glob('TEST-*.xml'))
          if not files:
              raise SystemExit('Gradle test task produced no JUnit XML; refusing a NO-SOURCE pass')
          tests = failures = errors = skipped = 0
          suites = []
          for path in files:
              root = ET.parse(path).getroot()
              suites.append(root.attrib.get('name', path.name))
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'suites={suites}')
          print(f'tests={tests}, failures={failures}, errors={errors}, skipped={skipped}')
          if tests < 10:
              raise SystemExit(f'Expected at least 10 deterministic tests, observed {tests}')
          if failures or errors:
              raise SystemExit('Deterministic test suite failed')
          PY

      - name: Verify packaged compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.2-release.jar'
          test -f "$jar_path"
          unzip -t "$jar_path" >/dev/null
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.2'

          for class_name in \
            net.runelite.client.compatibility.ClientCapabilityService \
            net.runelite.client.compatibility.EventConformance \
            net.runelite.client.compatibility.ProjectionCalibrationService \
            net.runelite.client.game.ItemSnapshotService \
            net.runelite.client.game.WidgetItemSnapshotStore \
            net.runelite.client.plugins.compatibilitydiagnostics.CompatibilityDiagnosticsPlugin; do
            javap -classpath "$jar_path" -p "$class_name" >/dev/null
          done

          javap -classpath "$jar_path" -v net.runelite.client.plugins.tileindicators.TileIndicatorsPlugin \
            | grep -F 'net.runelite.client.compatibility.RequiresCapabilities'
          javap -classpath "$jar_path" -v net.runelite.client.plugins.npcnames.NpcNamesPlugin \
            | grep -F 'net.runelite.client.compatibility.RequiresCapabilities'

      - name: Commit verified wave 2 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add -A
          git commit -m 'Add capability, event and snapshot conformance layer'
          git push origin HEAD:fix/v0.3.2-plugin-remediation-wave2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild from the exact committed source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :client:test :client:proguardJar --no-daemon --stacktrace

      - name: Verify and stage final wave 2 test build
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.2-release.jar'
          test -f "$jar_path"
          unzip -t "$jar_path" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('client/build/test-results/test').glob('TEST-*.xml'))
          tests = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
          if tests < 10 or failures or errors:
              raise SystemExit(f'Post-commit tests invalid: tests={tests}, failures={failures}, errors={errors}')
          Path('/tmp/wave2-test-count.txt').write_text(str(tests))
          PY

          mkdir -p release
          cp "$jar_path" release/void-client-0.3.2-remediation-wave2.jar
          sha256sum release/void-client-0.3.2-remediation-wave2.jar \
            > release/void-client-0.3.2-remediation-wave2.jar.sha256
          {
            echo 'branch=fix/v0.3.2-plugin-remediation-wave2'
            echo 'source_sha=${{ steps.commit.outputs.sha }}'
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "deterministic_tests=$(cat /tmp/wave2-test-count.txt)"
            echo 'scope=capability registry; event conformance; authoritative item containers and physical slot bounds; projection calibration canaries; diagnostics plugin; fail-closed Tile Indicators and NPC Names'
          } > release/void-client-0.3.2-remediation-wave2.build-info

      - name: Upload verified wave 2 build
        uses: actions/upload-artifact@v4
        with:
          name: void-client-v0.3.2-remediation-wave2
          path: release/
          if-no-files-found: error
          retention-days: 7
