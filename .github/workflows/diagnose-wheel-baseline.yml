name: Diagnose v0.1.1 mouse wheel handler

on:
  push:
    branches:
      - diagnostic/mouse-wheel-baseline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v0.1.1 release jar through ProGuard
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace
      - name: Inspect wheel-capable handler
        shell: bash
        run: |
          jar_path="client/build/libs/void-client-0.1.1-release.jar"
          echo '=== matching Class373 entries ==='
          jar tf "$jar_path" | grep 'Class373' || true
          echo '=== direct Class373_Sub1 inspection ==='
          if jar tf "$jar_path" | grep -qFx 'Class373_Sub1.class'; then
            javap -classpath "$jar_path" -p Class373_Sub1 || true
          else
            echo 'Class373_Sub1.class is absent from ProGuard output'
          fi
