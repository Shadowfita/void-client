name: Publish v0.3.0 now

on:
  push:
    branches:
      - release/v0.3.0
    paths:
      - '.github/workflows/publish-v0.3.0-now.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release metadata
        shell: bash
        run: |
          grep -F 'version = "0.3.0"' client/build.gradle.kts
          grep -Fx 'void.version= 0.3.0' client/src/net/runelite/client/runelite.properties
          test -f release-notes/v0.3.0.md
          git diff --exit-code 4489dd25fc559eeff38d2edf129dc381204b26cf -- client release-notes/v0.3.0.md

      - name: Build ProGuard release JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify release JAR
        shell: bash
        run: |
          jar_path='client/build/libs/void-client-0.3.0-release.jar'
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.0'

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          cp client/build/libs/void-client-0.3.0-release.jar release/void-client-0.3.0.jar
          (cd release && sha256sum void-client-0.3.0.jar > void-client-0.3.0.jar.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.3.0 --repo "$GITHUB_REPOSITORY" --clobber \
              release/void-client-0.3.0.jar \
              release/void-client-0.3.0.jar.sha256
          else
            if ! gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" \
              --target 4489dd25fc559eeff38d2edf129dc381204b26cf \
              --title 'v0.3.0' \
              --notes-file release-notes/v0.3.0.md \
              release/void-client-0.3.0.jar \
              release/void-client-0.3.0.jar.sha256; then
              gh release upload v0.3.0 --repo "$GITHUB_REPOSITORY" --clobber \
                release/void-client-0.3.0.jar \
                release/void-client-0.3.0.jar.sha256
            fi
          fi

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-client-v0.3.0-release
          path: |
            release/void-client-0.3.0.jar
            release/void-client-0.3.0.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Record run status
        if: always()
        shell: bash
        run: |
          mkdir -p debug
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\n' '${{ job.status }}' "$GITHUB_RUN_ID" '4489dd25fc559eeff38d2edf129dc381204b26cf' > debug/v0.3.0-release-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug/v0.3.0-release-status.txt
          git commit -m 'ci: record v0.3.0 release status' || true
          git push origin HEAD:release/v0.3.0
