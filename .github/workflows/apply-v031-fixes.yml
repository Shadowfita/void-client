name: Apply and verify v0.3.1 visual corrections

on:
  push:
    branches:
      - fix/v0.3.1-scaling-projection-defaults
    paths:
      - '.github/workflows/apply-v031-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed implementation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/v031-fixes.patch.gz.b64 | gzip -dc > /tmp/v031-fixes.patch
          git config core.whitespace cr-at-eol
          git apply --whitespace=nowarn /tmp/v031-fixes.patch
          git diff --check
          grep -F 'return client.projectLocalPoint(x, y, z);' client/src/net/runelite/api/Perspective.java
          grep -F 'getInterfaceTextureSupersampleFactor()' client/src/Applet_Sub1.java
          grep -F 'createInterfaceSupersampleTexture' client/src/ha_Sub2.java
          grep -F 'name = "Player Indicators"' client/src/net/runelite/client/plugins/playerindicators/PlayerIndicatorsPlugin.java
          grep -F 'version = "0.3.1"' client/build.gradle.kts
          grep -F 'void.version= 0.3.1' client/src/net/runelite/client/runelite.properties

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew :client:compileJava :client:test --no-daemon --stacktrace

      - name: Build ProGuard release JAR
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace

      - name: Verify and stage test release
        shell: bash
        run: |
          set -euo pipefail
          jar_path='client/build/libs/void-client-0.3.1-release.jar'
          test -f "$jar_path"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fx 'Main-Class: Loader'
          unzip -p "$jar_path" net/runelite/client/runelite.properties | tr -d '\r' | grep -Fx 'void.version= 0.3.1'
          javap -classpath "$jar_path" -p Class373_Sub1 > /tmp/Class373_Sub1.txt
          grep -F 'Class373_Sub1(java.awt.Component, boolean);' /tmp/Class373_Sub1.txt
          grep -F 'java.awt.event.MouseWheelListener' /tmp/Class373_Sub1.txt
          mkdir -p release
          cp "$jar_path" release/void-client-0.3.1-scaling-projection-test.jar
          (cd release && sha256sum void-client-0.3.1-scaling-projection-test.jar > void-client-0.3.1-scaling-projection-test.jar.sha256)

      - name: Upload verified test JAR
        uses: actions/upload-artifact@v4
        with:
          name: void-client-v0.3.1-scaling-projection-test
          path: |
            release/void-client-0.3.1-scaling-projection-test.jar
            release/void-client-0.3.1-scaling-projection-test.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          rm -f .tmp/v031-fixes.patch.gz.b64
          rm -f .github/workflows/apply-v031-fixes.yml
          rm -f .github/workflows/export-v031-source.yml
          git add -A
          git commit -m 'Fix fractional UI clarity and native world projection'
          git push origin HEAD:fix/v0.3.1-scaling-projection-defaults
