name: Export stabilization source

on:
  push:
    branches:
      - stabilization/0.3.0-compatibility
    paths:
      - '.github/workflows/export-stabilization-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run ID
        run: |
          mkdir -p debug
          printf '%s\n' "$GITHUB_RUN_ID" > debug/latest-stabilization-export-run-id.txt
          git config user.name 'Ryan Palmer'
          git config user.email 'www.ryan.palmer@hotmail.com'
          git add debug/latest-stabilization-export-run-id.txt
          git commit -m 'ci: record stabilization export run' || true
          git push origin HEAD:stabilization/0.3.0-compatibility

      - uses: actions/upload-artifact@v4
        with:
          name: void-client-stabilization-source
          path: |
            .
            !.git
            !**/build
            !out
          include-hidden-files: true
          retention-days: 2
