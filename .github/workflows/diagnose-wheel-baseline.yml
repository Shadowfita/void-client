name: Diagnose v0.1.1 mouse wheel handler

on:
  push:
    branches:
      - diagnostic/mouse-wheel-baseline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v4
      - name: Build v0.1.1 release jar through ProGuard
        run: ./gradlew :client:proguardJar --no-daemon --stacktrace
      - name: Inspect wheel-capable handler
        shell: bash
        run: |
          jar_path="client/build/libs/void-client-0.1.1-release.jar"
          mapping="client/build/proguard/mapping.txt"
          usage="client/build/proguard/usage.txt"

          echo '=== Class373_Sub1 mapping ==='
          grep '^Class373_Sub1 -> ' "$mapping" || true
          mapped=$(awk '$1 == "Class373_Sub1" && $2 == "->" { gsub(":", "", $3); print $3 }' "$mapping")
          echo "mapped=$mapped"

          echo '=== shrink usage references ==='
          grep -A8 -B2 '^Class373_Sub1' "$usage" || true

          if [ -z "$mapped" ]; then
            echo 'No ProGuard mapping for Class373_Sub1; class was likely removed.'
            exit 0
          fi

          class_path="${mapped//.//}.class"
          echo "class_path=$class_path"
          if ! jar tf "$jar_path" | grep -qFx "$class_path"; then
            echo 'Mapped Class373_Sub1 class is absent from output JAR.'
            exit 0
          fi

          echo '=== javap mapped handler ==='
          javap -classpath "$jar_path" -p "$mapped" | tee /tmp/wheel-handler.txt
          echo '=== constructor check ==='
          grep -F 'java.awt.Component, boolean' /tmp/wheel-handler.txt || echo 'MISSING Component/boolean constructor'
          echo '=== wheel interface check ==='
          grep -F 'java.awt.event.MouseWheelListener' /tmp/wheel-handler.txt || echo 'MISSING MouseWheelListener interface'
